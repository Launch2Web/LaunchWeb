<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="composition" data-composition-id="scene-stats" data-duration="4.5" data-fps="30">
    <div class="clip" id="scene-stats">
      <div class="stat-card" id="stat-1"
           data-enter="slide-up-fade"
           data-enter-duration="0.4"
           data-enter-start="0.24">
        <div class="stat-value">100%</div>
        <div class="stat-label">Custom Code &amp; Craft</div>
      </div>
      <div class="stat-card" id="stat-2"
           data-enter="slide-up-fade"
           data-enter-duration="0.4"
           data-enter-start="0.79">
        <div class="stat-value">98+</div>
        <div class="stat-label">Lighthouse Performance</div>
      </div>
      <div class="stat-card" id="stat-3"
           data-enter="slide-up-fade"
           data-enter-duration="0.4"
           data-enter-start="1.33">
        <div class="stat-value">10+</div>
        <div class="stat-label">Live Digital Products</div>
      </div>
      <div class="stat-card" id="stat-4"
           data-enter="slide-up-fade"
           data-enter-duration="0.4"
           data-enter-start="1.87">
        <div class="stat-value">24/7</div>
        <div class="stat-label">Dedicated Support</div>
      </div>
    </div>
  </div>
</body>
</html>
