<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="composition" data-composition-id="scene-services" data-duration="4" data-fps="30">
    <div class="clip" id="scene-services">
      <div class="service-card" id="svc-webdesign"
           data-enter="slide-up-fade"
           data-enter-duration="0.45"
           data-enter-start="0.11">
        <div class="service-badge">⚡ 01</div>
        <div class="service-title">Web Design &amp;<br>Development</div>
        <div class="service-desc">Modern, responsive websites designed to turn visitors into customers.</div>
      </div>
      <div class="service-card" id="svc-software"
           data-enter="slide-up-fade"
           data-enter-duration="0.45"
           data-enter-start="0.65">
        <div class="service-badge">💻 02</div>
        <div class="service-title">Custom<br>Software</div>
        <div class="service-desc">Purpose-built web applications backed by enterprise backends.</div>
      </div>
      <div class="service-card" id="svc-aiads"
           data-enter="slide-up-fade"
           data-enter-duration="0.45"
           data-enter-start="1.20">
        <div class="service-badge">✨ 08</div>
        <div class="service-title">AI Ads &amp;<br>Promotion</div>
        <div class="service-desc">AI-powered promotional videos for local businesses and shops.</div>
      </div>
    </div>
  </div>
</body>
</html>
