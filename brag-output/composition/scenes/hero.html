<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="composition" data-composition-id="scene-hero" data-duration="5" data-fps="30">
    <div class="clip" id="scene-hero">
      <div id="hero-brand"
           data-enter="fade"
           data-enter-duration="0.4"
           data-enter-start="0.2">
        <span class="dot"></span>
        Modern Digital Solutions Studio
      </div>
      <h1 class="hero-headline">
        <span class="hero-line" id="hero-line-1"
              data-enter="slide-up-fade"
              data-enter-duration="0.5"
              data-enter-start="0.5">
          Digital Experiences
        </span>
        <span class="hero-line" id="hero-line-2"
              data-enter="slide-up-fade"
              data-enter-duration="0.5"
              data-enter-start="1.0">
          Built to Move Your
        </span>
        <span class="hero-line hero-gradient" id="hero-line-3"
              data-enter="slide-up-fade"
              data-enter-duration="0.5"
              data-enter-start="1.5">
          Business Forward.
        </span>
      </h1>
      <div id="hero-tagline"
           data-enter="fade"
           data-enter-duration="0.5"
           data-enter-start="2.2">
        Web Design &bull; Software &bull; Digital Solutions
      </div>
    </div>
  </div>
</body>
</html>
